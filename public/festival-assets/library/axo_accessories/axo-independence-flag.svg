<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 1159" role="img" aria-labelledby="title desc">
  <title id="title">AXO Independence Day flag overlay</title>
  <desc id="desc">A correctly proportioned Indian flag attached to AXO's raised left hand without covering the face, chest logo, or belt branding.</desc>
  <defs>
    <filter id="flag-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#071a43" flood-opacity=".24"/>
    </filter>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8f5d16"/>
      <stop offset=".48" stop-color="#f5cf6a"/>
      <stop offset="1" stop-color="#9b681c"/>
    </linearGradient>
  </defs>
  <g filter="url(#flag-shadow)">
    <path d="M102 471 229 142" fill="none" stroke="#402b18" stroke-width="18" stroke-linecap="round"/>
    <path d="M102 471 229 142" fill="none" stroke="url(#pole)" stroke-width="12" stroke-linecap="round"/>
    <g>
      <rect x="19" y="118" width="216" height="48" rx="2" fill="#ff9933"/>
      <rect x="19" y="166" width="216" height="48" fill="#fff"/>
      <rect x="19" y="214" width="216" height="48" rx="2" fill="#138808"/>
      <rect x="19" y="118" width="216" height="144" rx="3" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
      <g transform="translate(127 190)" fill="none" stroke="#000080">
        <circle r="17" stroke-width="3"/>
        <circle r="3" fill="#000080" stroke="none"/>
        <g stroke-width="1.6">
          <line x1="0" y1="-3" x2="0" y2="-16"/>
          <line x1="0" y1="3" x2="0" y2="16"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(15)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(15)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(30)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(30)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(45)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(45)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(60)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(60)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(75)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(75)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(90)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(90)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(105)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(105)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(120)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(120)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(135)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(135)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(150)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(150)"/>
          <line x1="0" y1="-3" x2="0" y2="-16" transform="rotate(165)"/>
          <line x1="0" y1="3" x2="0" y2="16" transform="rotate(165)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
