      <stop offset="0" stop-color="#7857ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#34c5ff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="facetB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff78ba" stop-opacity="0.10"/>
