server {
    listen 80;
    listen [::]:80;
    server_name writex.co.in www.writex.co.in;

    return 301 https://www.writex.co.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name writex.co.in;

    ssl_certificate /etc/letsencrypt/live/writex.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writex.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.writex.co.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.writex.co.in;

    ssl_certificate /etc/letsencrypt/live/writex.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writex.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/writex.co.in.access.log;
    error_log /var/log/nginx/writex.co.in.error.log;

    client_max_body_size 30m;
    server_tokens off;

    location = /api/health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
