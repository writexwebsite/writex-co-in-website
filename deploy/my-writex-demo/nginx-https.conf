# MY_WRITEX_ISOLATED_DEMO
server {
    listen 80;
    listen [::]:80;
    server_name demo.writex.co.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/my-writex-demo/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://demo.writex.co.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.writex.co.in;

    ssl_certificate /etc/letsencrypt/live/demo.writex.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.writex.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/www/my-writex-demo/logs/nginx-access.log;
    error_log /var/www/my-writex-demo/logs/nginx-error.log;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Correlation-ID $request_id always;

    location ~ ^/(admin|employee|employee-login)(/|$) {
        return 404;
    }

    location ~ ^/client(/|$) {
        return 404;
    }

    location ~ ^/api/(admin|employee|contact|demo|hiring|jobs|quote|tools|trust|upload-brief|website-experience)(/|$) {
        return 404;
    }

    location ~ ^/api/client/(dashboard|download|files|invoices|overview|payment-proof|payment-status|preview|project|requests|revision-request|validate|work-journey)(/|$) {
        return 404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:__DEMO_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:__DEMO_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
