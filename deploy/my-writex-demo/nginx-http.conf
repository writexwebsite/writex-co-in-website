# MY_WRITEX_ISOLATED_DEMO
server {
    listen 80;
    listen [::]:80;
    server_name demo.writex.co.in;

    access_log /var/www/my-writex-demo/logs/nginx-access.log;
    error_log /var/www/my-writex-demo/logs/nginx-error.log;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/my-writex-demo/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ ^/(admin|employee|employee-login)(/|$) {
        return 404;
    }

    location ~ ^/client(/|$) {
        return 404;
    }

    location ~ ^/api/(admin|employee|contact|demo|hiring|jobs|quote|tools|trust|upload-brief|website-experience)(/|$) {
        return 404;
    }

    location ~ ^/api/client/(dashboard|download|files|invoices|overview|payment-proof|payment-status|preview|project|requests|revision-request|validate|work-journey)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:__DEMO_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1m;
    }
}
