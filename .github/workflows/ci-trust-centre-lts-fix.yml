name: Trust Centre LTS fix qualification

on:
  push:
    branches:
      - codex/trust-centre-lts-connection-fix-20261028

permissions:
  contents: read

concurrency:
  group: trust-centre-lts-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run signed LTS employee-login tests
        run: pnpm exec tsx --test tests/axo/lts-employee-login.test.ts

      - name: Run Trust Centre tests
        run: pnpm run test:trust

      - name: Type-check
        run: pnpm run typecheck

      - name: Build production bundle
        run: pnpm run build
